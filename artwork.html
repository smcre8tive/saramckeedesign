<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artwork — Sara McKee</title>
  <meta name="description" content="Sculpture, digital art and mixed media by Sara McKee.">
  <meta name="theme-color" content="#0f1014">
  <link rel="icon" type="image/png" href="img/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,600;0,800;1,600;1,800&family=Lexend:wght@300;400&display=swap" rel="stylesheet">

  <style>
    /* ── RESET ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    /* ── DESIGN TOKENS (same as Index) ── */
    :root {
      --gold:          #c8a84b;
      --gold-dark:     #857028;
      --bg:            #0f1014;
      --bg-warm:       #16140a;
      --text:          #FDFDFD;
      --text-muted:    #c8c8c8;
      --nav-bg:        rgba(15,16,20,.92);
      --footer-border: rgba(255,255,255,.1);
      --focus-ring:    #c8a84b;
      --line:          rgba(255,255,255,.25);
      --card-bg:       rgba(255,255,255,.05);
      --nav-h:         5rem;
    }
    [data-theme="light"] {
      --gold:          #857028;
      --gold-dark:     #6a5820;
      --bg:            #E7E2D0;
      --bg-warm:       #ddd8c4;
      --text:          #0F1014;
      --text-muted:    #4F564A;
      --focus-ring:    #857028;
      --nav-bg:        rgba(231,226,208,.95);
      --footer-border: rgba(15,16,20,.15);
      --line:          rgba(15,16,20,.3);
      --card-bg:       rgba(15,16,20,.05);
    }
    [data-theme="forest"] {
      --gold:          #c8a84b;
      --gold-dark:     #857028;
      --bg:            #4F564A;
      --bg-warm:       #424840;
      --text:          #E7E2D0;
      --text-muted:    #d8d4c4;
      --focus-ring:    #c8a84b;
      --nav-bg:        rgba(79,86,74,.95);
      --footer-border: rgba(231,226,208,.15);
      --line:          rgba(231,226,208,.35);
      --card-bg:       rgba(231,226,208,.07);
    }
    [data-theme="warm"] {
      --gold:          #857028;
      --gold-dark:     #6a5820;
      --bg:            #FDFDFD;
      --bg-warm:       #f5f0e8;
      --text:          #0F1014;
      --text-muted:    #4F564A;
      --focus-ring:    #857028;
      --nav-bg:        rgba(253,253,253,.97);
      --footer-border: rgba(15,16,20,.1);
      --line:          rgba(15,16,20,.3);
      --card-bg:       rgba(15,16,20,.04);
    }

    html, body, nav, footer, .skip-link, #mobile-menu { transition: background-color .35s ease, color .25s ease, border-color .3s ease; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    html { background: var(--bg); scroll-behavior: smooth; }
    body {
      font-family: 'Lexend', sans-serif; font-weight: 300;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased; min-height: 100vh;
    }

    :focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 4px; border-radius: 3px; }

    .skip-link {
      position: fixed; top: -100%; left: 1rem; z-index: 9999;
      background: var(--bg); color: var(--text);
      padding: .75rem 1.5rem; font-size: 1rem; text-decoration: underline;
      border: 2px solid var(--gold); border-radius: 4px; transition: top .2s ease;
    }
    .skip-link:focus { top: 1rem; }
    #main-content:focus { outline: none; }
    #main-content:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 4px; border-radius: 3px; }

    /* ══════════ NAV ══════════ */
    nav.site-nav {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--nav-h); z-index: 500; padding: 0 3rem;
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(to bottom, var(--nav-bg) 0%, rgba(0,0,0,0) 100%);
    }
    .nav-logo {
      color: var(--text); font-family: 'Spectral', Georgia, serif;
      font-size: .95rem; font-weight: 600; text-decoration: none;
      letter-spacing: .08em; text-transform: uppercase;
      display: flex; align-items: center; gap: .55rem;
      transition: opacity .2s; min-height: 44px;
    }
    .nav-logo:hover { opacity: .75; }
    .nav-logo-img { width: 22px; height: 22px; object-fit: contain; display: block; opacity: .9; transition: opacity .35s ease; }

    .nav-links { display: flex; align-items: center; gap: 1.8rem; list-style: none; }
    .nav-links a, .nav-links button {
      color: var(--text); font-size: .75rem; letter-spacing: .2em; text-transform: uppercase;
      text-decoration: none; background: none; border: none; cursor: pointer;
      font-family: 'Lexend', sans-serif; font-weight: 300;
      padding: .5rem 0; min-height: 44px; display: inline-flex; align-items: center;
      transition: opacity .2s;
    }
    .nav-links a:hover, .nav-links button:hover { opacity: .65; }

    .nav-sep { width: 1px; height: 14px; background: var(--text); opacity: .2; }
    .nav-social { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; opacity: .75; transition: opacity .2s; }
    .nav-social:hover { opacity: 1; }
    .nav-social svg { width: 18px; height: 18px; fill: var(--text); display: block; }

    .email-btn { text-decoration: none; color: inherit; position: relative; height: 44px; display: inline-flex; align-items: center; }
    .email-face-front, .email-face-back {
      display: flex; align-items: center; gap: .3rem; white-space: nowrap;
      transition: opacity .28s, transform .4s cubic-bezier(.76,0,.24,1);
    }
    .email-face-back { position: absolute; left: 0; opacity: 0; transform: translateY(6px); }
    .email-face-back svg { width: 9px; height: 9px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .email-btn:hover .email-face-front, .email-btn.flipped .email-face-front { opacity: 0; transform: translateY(-6px); }
    .email-btn:hover .email-face-back,  .email-btn.flipped .email-face-back  { opacity: 1; transform: none; }

    .nav-mobile-right { display: none; align-items: center; gap: .5rem; }
    .nav-hamburger {
      display: none; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
      width: 44px; height: 44px; background: none; border: none; cursor: pointer; padding: 0; color: var(--text);
    }
    .nav-hamburger span { display: block; width: 22px; height: 1.5px; background: var(--text); border-radius: 2px; transition: transform .3s ease, opacity .2s ease; }
    .nav-hamburger.is-open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .nav-hamburger.is-open span:nth-child(2) { opacity: 0; }
    .nav-hamburger.is-open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

    #mobile-menu {
      display: none; position: fixed; inset: 0; z-index: 490; background: var(--bg);
      flex-direction: column; justify-content: flex-start; align-items: flex-start;
      padding: calc(var(--nav-h) + 1rem) 0 2rem 2rem;
      opacity: 0; transition: opacity .3s ease; overflow-y: auto;
    }
    #mobile-menu.open { display: flex; }
    #mobile-menu.visible { opacity: 1; }
    .mob-nav-list { list-style: none; display: flex; flex-direction: column; margin-bottom: 2.5rem; }
    .mob-nav-list li a, .mob-nav-list li button {
      color: var(--text); font-family: 'Lexend', sans-serif; font-size: 1.55rem;
      letter-spacing: .18em; text-transform: uppercase; text-decoration: none;
      background: none; border: none; cursor: pointer; min-height: 52px;
      display: flex; align-items: center; opacity: .9; transition: opacity .2s, color .2s; padding: 0;
    }
    .mob-nav-list li a:hover, .mob-nav-list li button:hover { opacity: 1; color: var(--gold); }
    .mob-socials { display: flex; gap: .75rem; }
    .mob-social { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; opacity: .6; transition: opacity .2s; }
    .mob-social:hover { opacity: 1; }
    .mob-social svg { width: 20px; height: 20px; fill: var(--text); }
    #mobile-menu nav { position: static; display: block; height: auto; background: none; padding: 0; }

    /* ══════════ THEME SWITCHER ══════════ */
    #theme-switcher { position: fixed; top: calc(var(--nav-h) + .6rem); right: 1.2rem; z-index: 505; font-family: 'Lexend', sans-serif; }
    .theme-toggle-btn {
      display: flex; align-items: center; gap: .45rem; height: 36px; padding: 0 .75rem 0 .6rem;
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.18); border-radius: 40px;
      color: var(--text); cursor: pointer; backdrop-filter: blur(10px);
      transition: background .2s, border-color .2s, box-shadow .2s; font-family: 'Lexend', sans-serif;
    }
    [data-theme="light"] .theme-toggle-btn, [data-theme="warm"] .theme-toggle-btn { background: rgba(0,0,0,.07); border-color: rgba(0,0,0,.18); }
    .theme-toggle-btn:hover { background: rgba(200,168,75,.15); border-color: var(--gold); box-shadow: 0 0 12px rgba(200,168,75,.25); }
    .theme-toggle-btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; }
    .theme-chevron { width: 9px; height: 6px; opacity: .6; transition: transform .25s; }
    .theme-toggle-btn[aria-expanded="true"] .theme-chevron { transform: rotate(180deg); }
    .theme-current-icon { display: flex; align-items: center; }
    .theme-current-icon svg { width: 15px; height: 15px; display: block; }
    .theme-panel {
      min-width: 162px; background: var(--bg); border: 1px solid rgba(200,168,75,.3); border-radius: 12px;
      padding: .6rem .5rem .5rem; box-shadow: 0 8px 32px rgba(0,0,0,.45), 0 0 0 1px rgba(200,168,75,.08);
      animation: theme-panel-in .18s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes theme-panel-in { from { opacity: 0; transform: translateY(-6px) scale(.97); } to { opacity: 1; transform: none; } }
    #theme-panel { position: absolute; top: calc(100% + .55rem); right: 0; }
    #theme-panel-inline { position: absolute; top: calc(var(--nav-h) - .3rem); right: 1.5rem; z-index: 520; }
    .theme-panel-label { font-size: .6rem; letter-spacing: .22em; text-transform: uppercase; color: var(--text-muted); padding: 0 .5rem .45rem; border-bottom: 1px solid rgba(200,168,75,.15); margin-bottom: .35rem; }
    .theme-list { list-style: none; display: flex; flex-direction: column; gap: 2px; }
    .theme-list button {
      width: 100%; display: flex; align-items: center; gap: .6rem; padding: .5rem .6rem;
      border: none; background: none; cursor: pointer; color: var(--text); border-radius: 8px;
      font-family: 'Lexend', sans-serif; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase;
      transition: background .15s, color .15s; text-align: left;
    }
    .theme-list button:hover { background: rgba(200,168,75,.12); color: var(--gold); }
    .theme-list button.ts-active { background: rgba(200,168,75,.18); color: var(--gold); }
    .theme-list button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
    .theme-btn-icon { width: 18px; height: 18px; display: flex; align-items: center; flex-shrink: 0; }
    .theme-btn-icon svg { width: 18px; height: 18px; }
    .theme-list button.ts-active .theme-btn-label::after { content: ' ✓'; font-size: .65rem; opacity: .7; }

    /* ══════════ MAIN + HERO (same as Index) ══════════ */
    main {
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: calc(var(--nav-h) + 2rem) 3rem 4rem;
    }
    .site-hero { text-align: center; margin-bottom: 3rem; }
    .site-title {
      font-family: 'Spectral', Georgia, serif; font-size: clamp(3rem, 7vw, 6.5rem);
      font-weight: 800; line-height: .9; letter-spacing: -.04em; color: var(--text); margin-bottom: 1.4rem;
    }
    .site-title em { font-style: italic; font-weight: 600; }
    .doors-label {
      font-size: .75rem; letter-spacing: .32em; text-transform: uppercase; color: var(--text-muted);
      display: flex; align-items: center; justify-content: center; gap: .7rem;
    }
    .doors-label::before, .doors-label::after { content: ''; display: block; flex: 1; max-width: 80px; height: 1px; background: var(--line); }

    /* ══════════ FILTERS ══════════ */
    .filter-bar { display: flex; justify-content: center; flex-wrap: wrap; gap: .75rem; margin-bottom: 3rem; list-style: none; }
    .filter-btn {
      background: transparent; color: var(--text);
      border: 1px solid var(--line); border-radius: 40px;
      padding: .5rem 1.4rem; min-height: 44px;
      font-family: 'Lexend', sans-serif; font-weight: 300; font-size: .75rem;
      letter-spacing: .2em; text-transform: uppercase; cursor: pointer;
      transition: background .2s, color .2s, border-color .2s;
    }
    .filter-btn:hover { border-color: var(--gold); }
    .filter-btn[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

    /* ══════════ GALLERY ══════════ */
    .gallery { width: 100%; max-width: 1200px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 2.5rem 2rem; list-style: none; }
    .grid > li { animation: fadeIn .6s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .art-card {
      display: block; width: 100%; padding: 0; border: none; background: none; cursor: pointer;
      color: inherit; font: inherit; text-align: center;
    }
    .art-thumb {
      display: block; width: 100%; aspect-ratio: 4/5; overflow: hidden; border-radius: 2px;
      background: var(--card-bg);
      filter: drop-shadow(0 8px 28px rgba(0,0,0,.45));
      transition: filter .45s ease, transform .3s ease;
    }
    .art-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s ease; }
    @media (hover: hover) and (pointer: fine) {
      .art-card:hover .art-thumb { transform: translateY(-6px); filter: drop-shadow(0 0 14px rgba(133,112,40,.65)) drop-shadow(0 14px 36px rgba(0,0,0,.55)); }
      .art-card:hover .art-thumb img { transform: scale(1.05); }
      .art-card:hover .art-title { color: var(--gold); }
    }
    .art-card:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 5px; border-radius: 4px; }
    .art-card:focus-visible .art-title { color: var(--gold); }
    .art-label { display: block; padding-top: .75rem; }
    .art-title { font-family: 'Spectral', Georgia, serif; font-style: italic; font-size: 1rem; color: var(--text); display: block; margin-bottom: .2rem; transition: color .2s; }
    .art-category { font-size: .65rem; letter-spacing: .18em; text-transform: uppercase; color: var(--text-muted); display: block; }

    /* ══════════ MODAL ══════════ */
    .modal {
      display: none; position: fixed; inset: 0; z-index: 800;
      background: rgba(0,0,0,.92); justify-content: center; align-items: center; padding: 4.5rem 1.5rem 1.5rem;
      color: #FDFDFD;
    }
    .modal.active { display: flex; }
    .modal-content { max-width: 960px; width: 100%; max-height: 100%; display: flex; flex-direction: column; align-items: center; animation: modalZoom .35s ease; }
    @keyframes modalZoom { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
    .modal-image { max-width: 100%; max-height: 68vh; object-fit: contain; border-radius: 2px; }
    .modal-info { margin-top: 1.2rem; text-align: center; max-width: 60ch; }
    .modal-title { font-family: 'Spectral', Georgia, serif; font-style: italic; font-weight: 600; font-size: clamp(1.4rem, 3vw, 2rem); color: #e8cc78; margin-bottom: .4rem; }
    .modal-category { font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; color: #d8d8d8; margin-bottom: .6rem; }
    .modal-desc { font-size: .95rem; line-height: 1.7; color: #f0f0f0; }
    .close-modal {
      position: absolute; top: 1rem; right: 1.2rem; width: 44px; height: 44px;
      background: none; border: 1px solid rgba(255,255,255,.35); border-radius: 50%;
      color: #FDFDFD; font-size: 1.6rem; line-height: 1; cursor: pointer; transition: border-color .2s, color .2s;
    }
    .close-modal:hover { border-color: #e8cc78; color: #e8cc78; }
    .close-modal:focus-visible { outline: 3px solid #e8cc78; outline-offset: 3px; }

    /* ══════════ FOOTER (same as Index) ══════════ */
    footer {
      border-top: 1px solid var(--footer-border); padding: 2.5rem 3rem; margin-top: 2rem; width: 100%;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
    }
    .footer-name { font-family: 'Spectral', Georgia, serif; font-size: .88rem; font-weight: 600; font-style: italic; color: var(--text-muted); letter-spacing: .04em; }
    .footer-top-link {
      font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; color: var(--text-muted); text-decoration: none;
      display: inline-flex; align-items: center; gap: .4rem; opacity: 1; transition: color .2s; min-height: 44px;
    }
    .footer-top-link:hover { opacity: 1; color: var(--gold); }
    .footer-top-link svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

    /* ══════════ RESPONSIVE ══════════ */
    @media (max-width: 1050px) { main { padding: calc(var(--nav-h) + 1.5rem) 2rem 4rem; } }
    @media (max-width: 768px) {
      nav.site-nav { padding: 0 1.5rem; }
      .nav-links { display: none; }
      .nav-mobile-right { display: flex; }
      .nav-hamburger { display: flex; }
      main { padding: calc(var(--nav-h) + 1rem) 1.5rem 4rem; }
      .site-hero { margin-bottom: 2.5rem; }
      footer { padding: 2rem 1.5rem; }
      #theme-switcher { display: none; }
      .grid { gap: 2rem 1.5rem; }
    }
    @media (max-width: 560px) {
      :root { --nav-h: 4rem; }
      main { padding: calc(var(--nav-h) + .75rem) 1rem 3rem; }
      .site-hero { margin-bottom: 2rem; }
      .doors-label { font-size: .65rem; letter-spacing: .22em; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 1.5rem 1rem; }
      .art-title { font-size: .9rem; }
      .art-category { font-size: .56rem; letter-spacing: .12em; }
      .filter-btn { font-size: .68rem; letter-spacing: .14em; padding: .5rem 1rem; }
      footer { padding: 1.5rem 1rem; }
      .footer-name { font-size: .78rem; }
    }
    @media (forced-colors: active) { .art-thumb { border: 1px solid CanvasText; } .filter-btn[aria-pressed="true"] { border: 2px solid Highlight; } }
  </style>
</head>

      { title: "Red",             category: "painting",   image: "img/artwork/painting2.jpeg",    description: "Acrylic painting of a woman who knows nothing." },
      { title: "Rebels Series",   category: "sculpture",  image: "img/artwork/sculpture2.jpeg",   description: "Porcelian depictions of Leia and Yoda." }
    ];
    var CATEGORY_NAMES = { sculpture: "Sculpture", digital: "Digital", mixedmedia: "Mixed Media", painting: "Painting" };

  <!-- Gallery + viewer -->
  <script>
  (function () {
    'use strict';
    var gallery = document.getElementById('gallery');
    var status  = document.getElementById('gallery-status');
    var modal   = document.getElementById('modal');
    var mImg    = document.getElementById('modalImage');
    var mTitle  = document.getElementById('modalTitle');
    var mCat    = document.getElementById('modalCategory');
    var mDesc   = document.getElementById('modalDesc');
    var closeBtn = document.getElementById('closeModal');
    var filterBtns = document.querySelectorAll('.filter-btn');
    var lastFocus = null;

    function catName(c) { return CATEGORY_NAMES[c] || c; }

    function render(filter) {
      gallery.innerHTML = '';
      var list = filter === 'all' ? ARTWORKS : ARTWORKS.filter(function (a) { return a.category === filter; });
      list.forEach(function (art, i) {
        var li = document.createElement('li');
        li.style.animationDelay = (i * 0.06) + 's';
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'art-card';
        btn.setAttribute('aria-haspopup', 'dialog');

        var thumb = document.createElement('span'); thumb.className = 'art-thumb';
        var img = document.createElement('img');
        img.src = art.image; img.alt = art.title + ' — ' + art.description; img.loading = 'lazy';
        thumb.appendChild(img);

        var label = document.createElement('span'); label.className = 'art-label';
        var t = document.createElement('span'); t.className = 'art-title'; t.textContent = art.title;
        var c = document.createElement('span'); c.className = 'art-category'; c.textContent = catName(art.category);
        label.appendChild(t); label.appendChild(c);

        btn.appendChild(thumb); btn.appendChild(label);
        btn.addEventListener('click', function () { openModal(art, btn); });
        li.appendChild(btn); gallery.appendChild(li);
      });
      status.textContent = 'Showing ' + list.length + ' artwork' + (list.length === 1 ? '' : 's') +
        (filter === 'all' ? '.' : ' in ' + catName(filter) + '.');
    }

    function openModal(art, trigger) {
      lastFocus = trigger;
      mImg.src = art.image; mImg.alt = art.title + ' — ' + art.description;
      mTitle.textContent = art.title;
      mCat.textContent = catName(art.category);
      mDesc.textContent = art.description;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
      closeBtn.focus();
    }
    function closeModal() {
      modal.classList.remove('active');
      document.body.style.overflow = '';
      if (lastFocus) lastFocus.focus();
    }

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', function (e) {
      if (!modal.classList.contains('active')) return;
      if (e.key === 'Escape') closeModal();
      if (e.key === 'Tab') { e.preventDefault(); closeBtn.focus(); } /* only one control in the viewer */
    });

    filterBtns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        filterBtns.forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
        btn.setAttribute('aria-pressed', 'true');
        render(btn.dataset.filter);
      });
    });

    render('all');
  })();
  </script>

  <!-- Mobile drawer (same as Index) -->
  <script>
  (function () {
    var hamburger = document.getElementById('hamburger-btn'), drawer = document.getElementById('mobile-menu'), isOpen = false;
    function focusable() { return [].slice.call(drawer.querySelectorAll('a, button')).filter(function (el) { return !el.disabled; }); }
    function openDrawer() {
      isOpen = true; drawer.classList.add('open'); drawer.scrollTop = 0;
      requestAnimationFrame(function () { requestAnimationFrame(function () { drawer.classList.add('visible'); }); });
      hamburger.classList.add('is-open'); hamburger.setAttribute('aria-expanded', 'true'); hamburger.setAttribute('aria-label', 'Close navigation menu');
      document.body.style.overflow = 'hidden';
      var first = focusable()[0]; if (first) setTimeout(function () { first.focus(); }, 50);
    }
    function closeDrawer() {
      isOpen = false; drawer.classList.remove('visible');
      setTimeout(function () { drawer.classList.remove('open'); }, 300);
      hamburger.classList.remove('is-open'); hamburger.setAttribute('aria-expanded', 'false'); hamburger.setAttribute('aria-label', 'Open navigation menu');
      document.body.style.overflow = ''; hamburger.focus();
    }
    hamburger.addEventListener('click', function () { isOpen ? closeDrawer() : openDrawer(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer(); });
    drawer.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab') return;
      var items = focusable(), first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
    drawer.addEventListener('click', function (e) { if (e.target === drawer) closeDrawer(); });
    [].forEach.call(drawer.querySelectorAll('.mob-nav-list a[href]'), function (el) { el.addEventListener('click', closeDrawer); });
  })();
  </script>

  <!-- Theme switcher (same as Index, plus logo swap used on the About page) -->
  <script>
  (function () {
    var STORAGE_KEY = 'ks-theme';
    var THEMES = [
      { id: 'dark',   label: 'Dark mode',           title: 'Dark',   logo: 'img/logowhite.png', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>' },
      { id: 'light',  label: 'Light mode',          title: 'Light',  logo: 'img/logoblack.png', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>' },
      { id: 'warm',   label: 'Warm parchment mode', title: 'Warm',   logo: 'img/logoblack.png', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 0 0 0 20c1 0 2-.8 2-2 0-.5-.2-1-.4-1.4-.2-.4-.4-.8-.4-1.2 0-1.1.9-2 2-2h2.5A5.5 5.5 0 0 0 22 9.5C22 5.36 17.46 2 12 2z"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor" stroke="none"/><circle cx="14.5" cy="7.5" r="1.5" fill="currentColor" stroke="none"/><circle cx="7.5" cy="13" r="1" fill="currentColor" stroke="none"/></svg>' },
      { id: 'forest', label: 'Forest mode',         title: 'Forest', logo: 'img/logowhite.png', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12,2 4,12 8,12 6,22 18,22 16,12 20,12"/></svg>' }
    ];
    var logoImg = document.getElementById('nav-logo-img');

    function applyTheme(id, save) {
      if (save === undefined) save = true;
      document.documentElement.setAttribute('data-theme', id);
      if (save) { try { localStorage.setItem(STORAGE_KEY, id); } catch (e) {} }
      var theme = THEMES.filter(function (t) { return t.id === id; })[0] || THEMES[0];
      document.getElementById('theme-current-icon').innerHTML = theme.icon;
      document.getElementById('inline-current-icon').innerHTML = theme.icon;
      if (logoImg && theme.logo) logoImg.src = theme.logo;
      [].forEach.call(document.querySelectorAll('.theme-list button'), function (btn) {
        var active = btn.dataset.themeId === id;
        btn.setAttribute('aria-checked', active ? 'true' : 'false');
        btn.classList.toggle('ts-active', active);
      });
    }
    function buildList(listEl, panelEl, toggleBtn) {
      THEMES.forEach(function (theme) {
        var li = document.createElement('li'); li.setAttribute('role', 'none');
        var btn = document.createElement('button');
        btn.setAttribute('role', 'menuitemradio'); btn.setAttribute('aria-checked', 'false');
        btn.setAttribute('aria-label', theme.label); btn.dataset.themeId = theme.id;
        btn.innerHTML = '<span class="theme-btn-icon" aria-hidden="true">' + theme.icon + '</span><span class="theme-btn-label">' + theme.title + '</span>';
        btn.addEventListener('click', function () { applyTheme(theme.id); closePanel(panelEl, toggleBtn, false); });
        li.appendChild(btn); listEl.appendChild(li);
      });
    }
    function openPanel(panelEl, toggleBtn) {
      panelEl.hidden = false; toggleBtn.setAttribute('aria-expanded', 'true');
      var first = panelEl.querySelector('button'); if (first) setTimeout(function () { first.focus(); }, 10);
    }
    function closePanel(panelEl, toggleBtn, returnFocus) {
      panelEl.hidden = true; toggleBtn.setAttribute('aria-expanded', 'false');
      if (returnFocus !== false) toggleBtn.focus();
    }
    function addKeyNav(panelEl, toggleBtn) {
      panelEl.addEventListener('keydown', function (e) {
        var items = [].slice.call(panelEl.querySelectorAll('button')), idx = items.indexOf(document.activeElement);
        if (e.key === 'ArrowDown') { e.preventDefault(); items[(idx + 1) % items.length].focus(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); items[(idx - 1 + items.length) % items.length].focus(); }
        else if (e.key === 'Escape' || e.key === 'Tab') { closePanel(panelEl, toggleBtn); }
      });
    }

    var dToggle = document.getElementById('theme-toggle-btn'), dPanel = document.getElementById('theme-panel'), dList = document.getElementById('theme-list');
    buildList(dList, dPanel, dToggle);
    dToggle.addEventListener('click', function () { dPanel.hidden ? openPanel(dPanel, dToggle) : closePanel(dPanel, dToggle); });
    addKeyNav(dPanel, dToggle);

    var iToggle = document.getElementById('theme-toggle-inline'), iPanel = document.getElementById('theme-panel-inline'), iList = document.getElementById('theme-list-inline');
    buildList(iList, iPanel, iToggle);
    iToggle.addEventListener('click', function () { iPanel.hidden ? openPanel(iPanel, iToggle) : closePanel(iPanel, iToggle); });
    addKeyNav(iPanel, iToggle);

    document.addEventListener('pointerdown', function (e) {
      var sw = document.getElementById('theme-switcher'), mr = document.getElementById('nav-mobile-right');
      if (sw && !sw.contains(e.target)) closePanel(dPanel, dToggle, false);
      if (mr && !mr.contains(e.target) && !iPanel.contains(e.target)) closePanel(iPanel, iToggle, false);
    });

    var saved; try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
    if (saved && THEMES.some(function (t) { return t.id === saved; })) applyTheme(saved, false);
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) applyTheme('light', false);
    else applyTheme('dark', false);
  })();
  </script>
